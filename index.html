<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dangi Samaj Portal</title>
<meta name="description" content="दांगी समाज सदस्य पंजीकरण · Dangi community member registration">
<meta name="theme-color" content="#1c2f6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: one centred column (1080px) under a deep register-ink header; forms single-column on phones.
   Palette: register ink blue + marigold, on a cool paper ground. */
:root {
  --paper: #f3f5f4;
  --surface: #ffffff;
  --sunk: #eaeeec;
  --ink: #17213a;
  --muted: #5a6475;
  --line: #d8dfdc;
  --primary: #1c2f6e;
  --primary-ink: #ffffff;
  --header: #1c2f6e;
  --header-ink: #eef1fb;
  --marigold: #d98a0b;
  --marigold-soft: #fbefd6;
  --ok: #17734a;   --ok-soft: #dff2e8;
  --warn: #9a5a00; --warn-soft: #fbedd5;
  --bad: #b3261e;  --bad-soft: #fbe3e0;
  --focus: #d98a0b;
  --font-display: "Tiro Devanagari Hindi", "Noto Serif Devanagari", Georgia, serif;
  --font-body: "Mukta", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1421; --surface: #171e2e; --sunk: #1d2537; --ink: #e8ecf4; --muted: #9ba5b9; --line: #2b3448;
    --primary: #9fb3ff; --primary-ink: #0f1421; --header: #131b33; --header-ink: #e8ecf4;
    --marigold: #f0b44a; --marigold-soft: #3a2c12;
    --ok: #5fd39a; --ok-soft: #15301f; --warn: #f2b65a; --warn-soft: #36280f; --bad: #ff8a80; --bad-soft: #3b1715; --focus: #f0b44a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1421; --surface: #171e2e; --sunk: #1d2537; --ink: #e8ecf4; --muted: #9ba5b9; --line: #2b3448;
  --primary: #9fb3ff; --primary-ink: #0f1421; --header: #131b33; --header-ink: #e8ecf4;
  --marigold: #f0b44a; --marigold-soft: #3a2c12;
  --ok: #5fd39a; --ok-soft: #15301f; --warn: #f2b65a; --warn-soft: #36280f; --bad: #ff8a80; --bad-soft: #3b1715; --focus: #f0b44a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--header); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.boot, .loading { padding: 48px 16px; text-align: center; color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
code { background: var(--sunk); padding: 1px 6px; border-radius: 4px; font-size: .9em; }

/* header */
.demo-bar { background: var(--marigold-soft); color: var(--warn); font-size: .875rem; padding-block: 6px; }
.top { background: var(--header); color: var(--header-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; text-align: left; min-width: 0; }
.mark { position: relative; width: 34px; height: 34px; flex: none; }
.mark i { position: absolute; border-radius: 50%; border: 2px solid var(--marigold); inset: 0; }
.mark i:nth-child(2) { inset: 7px; opacity: .8; }
.mark i:nth-child(3) { inset: 13px; background: var(--marigold); border: 0; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-text b { font: 400 1.35rem/1.1 var(--font-display); }
.brand-text small { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-right { display: flex; align-items: center; gap: 12px; }
.who { display: flex; flex-direction: column; text-align: right; line-height: 1.2; }
.who b { font-weight: 600; font-size: .875rem; }
.who small { opacity: .75; font-size: .8rem; }
.tabs { border-top: 1px solid color-mix(in srgb, var(--header-ink) 14%, transparent); }
.tabs-in { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; color: var(--header-ink); opacity: .72; padding: 10px 12px; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; font-weight: 500; }
.tab:hover { opacity: 1; }
.tab.on { opacity: 1; border-bottom-color: var(--marigold); }

.main { padding-block: 24px 40px; display: flex; flex-direction: column; gap: 20px; }
.foot { color: var(--muted); font-size: .8rem; padding-block: 0 32px; }

/* type */
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 400 clamp(1.8rem, 5vw, 2.6rem)/1.15 var(--font-display); }
.h2 { font: 400 1.7rem/1.2 var(--font-display); }
.h3 { font-size: 1.05rem; font-weight: 600; }
.eyebrow { margin: 0 0 4px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--marigold); font-weight: 600; }
.intro { max-width: 640px; }
.lede { color: var(--muted); margin: 8px 0 0; max-width: 60ch; }

/* building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.card.flush { padding: 0; overflow: hidden; }
.card.narrow { max-width: 440px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.card.empty { text-align: center; color: var(--muted); }
.form { display: flex; flex-direction: column; gap: 22px; max-width: 720px; }
.group { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.group legend { padding: 0; margin-bottom: 10px; font-weight: 600; color: var(--primary); font-size: .95rem; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.span2 { grid-column: span 2; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.loc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .875rem; font-weight: 500; color: var(--muted); }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; }
select:disabled { background: var(--sunk); color: var(--muted); }
textarea { resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
.consent { display: flex; gap: 12px; align-items: flex-start; background: var(--marigold-soft); padding: 14px; border-radius: 8px; cursor: pointer; }
.consent input { width: 22px; height: 22px; min-height: 0; flex: none; margin-top: 3px; accent-color: var(--primary); }
.consent small { display: block; color: var(--muted); margin-top: 4px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.center { justify-content: center; }
.wrap-row { align-items: flex-end; gap: 12px; }
.grow { flex: 1 1 200px; }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 500; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--primary); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.big { min-height: 50px; padding: 10px 24px; font-size: 1.05rem; }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: .875rem; }
.btn.ghost { background: transparent; }
.btn.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.on-dark { background: transparent; color: var(--header-ink); border-color: color-mix(in srgb, var(--header-ink) 35%, transparent); }
.btn.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.danger-text { color: var(--bad); }
.link { background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }

.pill { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .03em; padding: 1px 8px; border-radius: 99px; vertical-align: middle; }
.pill.verified { background: var(--ok-soft); color: var(--ok); }
.pill.pending { background: var(--warn-soft); color: var(--warn); }
.pill.rejected { background: var(--bad-soft); color: var(--bad); }
.pill.role { background: var(--sunk); color: var(--primary); }

.note { padding: 12px 14px; border-radius: 8px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.stat span { font-size: .85rem; color: var(--muted); }
.stat b { font: 600 1.9rem/1.1 var(--font-body); font-variant-numeric: tabular-nums; }
.stat b small { font-size: .9rem; font-weight: 500; color: var(--muted); }
.stat.ok b { color: var(--ok); }
.stat.warn b { color: var(--warn); }
.stat .link { align-self: flex-start; font-size: .85rem; }

/* tables */
.table-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 16px; background: var(--sunk); }
.tbl td { padding: 11px 16px; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.end { text-align: right; white-space: nowrap; }
.drill tbody tr { cursor: pointer; }
.drill tbody tr:hover { background: var(--sunk); }
.drill tr.zero td { color: var(--muted); }
.bar-col { width: 34%; }
.bar { position: relative; display: block; height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--marigold) 45%, transparent); border-radius: 99px; }
.bar i.v { background: var(--primary); }

.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.crumbs i { font-style: normal; opacity: .6; }
.crumbs span { color: var(--ink); font-weight: 600; }

/* member list */
.mlist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 20px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }
.m-name { font-weight: 600; font-size: 1.02rem; }
.m-sub, .m-place { font-size: .875rem; color: var(--muted); }
.m-place { color: var(--primary); }
.m-phone { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.m-act { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.filters { display: flex; flex-direction: column; gap: 14px; }

/* messaging */
.msg-sum { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.msg-sum b { font: 600 2.2rem/1 var(--font-body); color: var(--primary); font-variant-numeric: tabular-nums; }
.actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 18px; }
.act-card { background: var(--sunk); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.act-card h3 { font-size: 1rem; font-weight: 600; }
.act-card p { margin: 0; font-size: .875rem; color: var(--muted); flex: 1; }
.queue { list-style: none; margin: 0; padding: 0; max-height: 480px; overflow-y: auto; }
.queue li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
.queue li:first-child { border-top: 0; }
.queue span { display: flex; flex-direction: column; min-width: 0; }
.queue small { color: var(--muted); }

/* locations */
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.chips button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.chips button:disabled { cursor: default; opacity: 1; }
.chips small { color: var(--muted); }

/* success, login, misc */
.success { text-align: center; max-width: 560px; margin: 24px auto; display: flex; flex-direction: column; gap: 10px; align-items: center; padding-block: 32px; }
.success p { color: var(--muted); margin: 0 0 8px; }
.tick { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); position: relative; }
.tick::after { content: ""; position: absolute; left: 22px; top: 14px; width: 14px; height: 28px; border: solid var(--ok); border-width: 0 4px 4px 0; transform: rotate(45deg); }
.demo-logins { border-top: 1px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.demo-logins p { margin: 0; font-size: .875rem; }
.error-card { border-color: var(--bad); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 8px; z-index: 50; max-width: min(92vw, 520px); box-shadow: 0 8px 24px rgb(0 0 0 / .2); transition: opacity .4s, transform .4s; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.warn { background: var(--warn); color: #fff; }
.toast.out { opacity: 0; transform: translate(-50%, 8px); }
.modal-back { position: fixed; inset: 0; background: rgb(10 14 25 / .5); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--r); padding: 20px; max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.modal p { margin: 0; }

@media (max-width: 640px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .span2 { grid-column: auto; }
  .hide-sm { display: none; }
  .bar-col { width: 30%; }
  .mrow { grid-template-columns: minmax(0, 1fr) auto; }
  .m-act { grid-column: 1 / -1; justify-content: flex-start; }
  .who small { display: none; }
  .who { max-width: 110px; }
  .brand-text small { display: none; }
  .card { padding: 16px; }
  .form .row.end .btn.big { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* Gaya update: subdivision groups, village coverage */
.tbl tr.grp td { background: var(--marigold-soft); color: var(--warn); font-weight: 600; font-size: .85rem; letter-spacing: .02em; padding-block: 7px; }
.tbl tr.grp td span { float: right; font-weight: 500; color: var(--muted); }
.tbl td small { color: var(--muted); }
.drill tr.grp { cursor: default; }
.drill tr.grp:hover { background: none; }
.sub { margin: 2px 0 0; }
.meter { display: block; height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--marigold); border-radius: 99px; }
.hint { margin: -4px 0 0; font-size: .875rem; color: var(--muted); background: var(--sunk); padding: 8px 12px; border-radius: 8px; }
.hint b { color: var(--ink); font-weight: 600; }
optgroup { font-style: normal; font-weight: 600; }

/* booths */
.pill.booth { background: var(--sunk); color: var(--primary); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; align-self: flex-start; background: var(--sunk); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--primary); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.tbl.booths td:nth-child(2) { min-width: 200px; }
.tbl.booths td.num.mono { color: var(--muted); width: 48px; }
.booth-list { list-style: none; margin: 0; padding: 0; columns: 2 280px; column-gap: 24px; font-size: .9rem; }
.booth-list li { break-inside: avoid; padding: 5px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
.booth-list b { font-variant-numeric: tabular-nums; color: var(--primary); min-width: 32px; }
.note.ok-note { background: var(--ok-soft); color: var(--ink); font-size: .9rem; }

</style>
</head>

<script>
/* =====================================================================
   Data layer — one interface, two backends:
   • live  : Supabase (when SUPABASE_URL is set in config.js)
   • demo  : sample members on the real Gaya blocks and panchayats — for trying the app
   ===================================================================== */
(function () {
  const LEVELS = ['state', 'district', 'block', 'panchayat', 'village'];
  window.LEVELS = LEVELS;
  const LOC_COLS = 'id,level,name,name_hi,parent_id,path,subdivision,expected_villages';

  function friendlyError(e) {
    const code = e && (e.code || e.status);
    const msg = (e && e.message) || String(e);
    if (code === '23505' || /duplicate key/i.test(msg))
      return new Error('यह सदस्य पहले से पंजीकृत है। This person is already registered with this mobile number.');
    if (code === '42501' || /row-level security|permission denied/i.test(msg))
      return new Error("You don't have permission to change data outside your area.");
    if (/Failed to fetch|NetworkError|network/i.test(msg)) {
      const err = new Error('No internet connection.'); err.offline = true; return err;
    }
    return new Error(msg.replace(/^.*?ERROR:\s*/, ''));
  }

  function cleanPhone(p) {
    const d = String(p || '').replace(/\D/g, '');
    return d ? d.slice(-10) : '';
  }
  window.cleanPhone = cleanPhone;

  // same tidy-up the database does: trim, single spaces, Title Case
  function tidyVillage(v) {
    return String(v || '').trim().replace(/\s+/g, ' ').toLowerCase().replace(/(^|[\s(-])\S/g, c => c.toUpperCase());
  }
  window.tidyVillage = tidyVillage;

  function matches(m, f) {
    if (f.locationId && !m.location_path.includes(f.locationId)) return false;
    if (f.status && m.status !== f.status) return false;
    if (f.excludeRejected && m.status === 'rejected') return false;
    if (f.gender && m.gender !== f.gender) return false;
    if (f.ageMin && !(m.age >= f.ageMin)) return false;
    if (f.ageMax && !(m.age <= f.ageMax)) return false;
    if (f.occupation && !(m.occupation || '').toLowerCase().includes(f.occupation.toLowerCase())) return false;
    if (f.village && !(m.village_name || '').toLowerCase().includes(f.village.toLowerCase())) return false;
    if (f.boothNo && m.booth_no !== +f.boothNo) return false;
    if (f.boothId && m.booth_id !== +f.boothId) return false;
    if (f.q) {
      const s = f.q.toLowerCase();
      if (![m.full_name, m.phone, m.guardian_name].some(v => (v || '').toLowerCase().includes(s))) return false;
    }
    return true;
  }

  /* ------------------------------------------------------------------ LIVE */
  function createLive(cfg) {
    const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    const cache = new Map();
    const remember = rows => (rows || []).forEach(r => cache.set(r.id, r));
    const chk = ({ data, error, count }) => { if (error) throw friendlyError(error); return { data, count }; };
    const clean = s => s.replace(/[%_,()*]/g, ' ').trim();

    function filtered(q, f) {
      if (f.locationId) q = q.contains('location_path', [f.locationId]);
      if (f.status) q = q.eq('status', f.status);
      if (f.excludeRejected) q = q.neq('status', 'rejected');
      if (f.gender) q = q.eq('gender', f.gender);
      if (f.ageMin) q = q.gte('age', f.ageMin);
      if (f.ageMax) q = q.lte('age', f.ageMax);
      if (f.occupation) q = q.ilike('occupation', `%${clean(f.occupation)}%`);
      if (f.village) q = q.ilike('village_name', `%${clean(f.village)}%`);
      if (f.boothNo) q = q.eq('booth_no', +f.boothNo);
      if (f.boothId) q = q.eq('booth_id', +f.boothId);
      if (f.q) {
        const s = clean(f.q);
        if (s) q = q.or(`full_name.ilike.%${s}%,phone.ilike.%${s}%,guardian_name.ilike.%${s}%`);
      }
      return q;
    }

    return {
      mode: 'live',
      async session() { return (await sb.auth.getSession()).data.session; },
      onAuth(cb) { sb.auth.onAuthStateChange((_ev, s) => cb(s)); },
      async sendCode(email) {
        chk(await sb.auth.signInWithOtp({
          email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname }
        }));
      },
      async verifyCode(email, token) { chk(await sb.auth.verifyOtp({ email, token, type: 'email' })); },
      async signOut() { await sb.auth.signOut(); },
      async me() { const { data } = chk(await sb.rpc('me')); return (data && data[0]) || null; },

      async children(parentId) {
        let q = sb.from('locations').select(LOC_COLS).order('name').limit(5000);
        q = parentId == null ? q.is('parent_id', null) : q.eq('parent_id', parentId);
        const { data } = chk(await q); remember(data); return data;
      },
      async locations(ids) {
        ids = [...new Set(ids.filter(Boolean))];
        const need = ids.filter(i => !cache.has(i));
        for (let i = 0; i < need.length; i += 150) {
          const { data } = chk(await sb.from('locations').select(LOC_COLS).in('id', need.slice(i, i + 150)));
          remember(data);
        }
        return ids.map(i => cache.get(i)).filter(Boolean);
      },
      async addLocation(loc) {
        const { data } = chk(await sb.from('locations').insert(loc).select(LOC_COLS).single());
        remember([data]); return data;
      },
      async villageNames(panchayatId) {
        const { data } = chk(await sb.rpc('village_names', { p_panchayat: panchayatId }));
        return data || [];
      },

      async booths(panchayatId) {
        const { data } = chk(await sb.from('booths').select('id,assembly,number,name,panchayat_id').eq('panchayat_id', panchayatId).order('number'));
        return data || [];
      },
      async boothsByIds(ids) {
        ids = [...new Set(ids.filter(Boolean))]; if (!ids.length) return [];
        const { data } = chk(await sb.from('booths').select('id,assembly,number,name,panchayat_id').in('id', ids));
        return data || [];
      },
      async boothBreakdown(locId) {
        const { data } = chk(await sb.rpc('booth_breakdown', { p_location: locId }));
        return (data || []).map(r => ({ ...r, total: +r.total, verified: +r.verified, pending: +r.pending }));
      },

      async registerPublic(m) {
        chk(await sb.from('members').insert({ ...m, status: 'pending', source: 'self', created_by: null }));
      },
      async addMember(m) {
        const s = await this.session();
        chk(await sb.from('members').insert({ ...m, source: 'coordinator', status: m.status || 'verified', created_by: s && s.user.id }));
      },
      async updateMember(id, patch) { chk(await sb.from('members').update(patch).eq('id', id)); },
      async deleteMember(id) { chk(await sb.from('members').delete().eq('id', id)); },
      async getMember(id) { const { data } = chk(await sb.from('members').select('*').eq('id', id).single()); return data; },
      async listMembers(f, { offset = 0, limit = 50 } = {}) {
        let q = filtered(sb.from('members').select('*', { count: 'exact' }), f);
        q = q.order('created_at', { ascending: false }).range(offset, offset + limit - 1);
        const { data, count } = chk(await q);
        return { rows: data, count: count || 0 };
      },
      async counts(parentId) {
        const { data } = chk(await sb.rpc('member_counts', { p_parent: parentId ?? null }));
        return (data || []).map(r => ({ ...r, total: +r.total, verified: +r.verified, pending: +r.pending,
          villages_reached: +r.villages_reached, expected_villages: r.expected_villages == null ? null : +r.expected_villages }));
      },
      async villageBreakdown(panchayatId) {
        const { data } = chk(await sb.rpc('village_breakdown', { p_panchayat: panchayatId }));
        return (data || []).map(r => ({ ...r, total: +r.total, verified: +r.verified, pending: +r.pending }));
      },

      async coordinators() { const { data } = chk(await sb.from('coordinators').select('*').order('role')); return data; },
      async saveCoordinator(c) { chk(await sb.from('coordinators').upsert(c)); },
      async removeCoordinator(email) { chk(await sb.from('coordinators').delete().eq('email', email)); }
    };
  }

  /* ------------------------------------------------------------------ DEMO */
  function createDemo() {
    let nextId = 1;
    const locs = new Map();
    const add = (level, name, parent, extra = {}) => {
      const id = nextId++;
      const path = parent ? [...locs.get(parent).path, id] : [id];
      const l = { id, level, name, name_hi: null, parent_id: parent || null, path, subdivision: null, expected_villages: null, ...extra };
      locs.set(id, l); return id;
    };
    const bihar = add('state', 'Bihar', null, { name_hi: 'बिहार' });
    const D = {};
    ['Araria', 'Arwal', 'Aurangabad', 'Banka', 'Begusarai', 'Bhagalpur', 'Bhojpur', 'Buxar', 'Darbhanga',
      'East Champaran', 'Gaya', 'Gopalganj', 'Jamui', 'Jehanabad', 'Kaimur', 'Katihar', 'Khagaria', 'Kishanganj',
      'Lakhisarai', 'Madhepura', 'Madhubani', 'Munger', 'Muzaffarpur', 'Nalanda', 'Nawada', 'Patna', 'Purnia',
      'Rohtas', 'Saharsa', 'Samastipur', 'Saran', 'Sheikhpura', 'Sheohar', 'Sitamarhi', 'Siwan', 'Supaul',
      'Vaishali', 'West Champaran'].forEach(n => { D[n] = add('district', n, bihar); });

    // real Gaya blocks and panchayats (js/gaya-data.js)
    const panchayats = []; const blockId = {}; const panchId = {};
    for (const [block, info] of Object.entries(window.GAYA_DATA || {})) {
      const bid = add('block', block, D.Gaya, { subdivision: info.s }); blockId[block] = bid;
      for (const [p, v] of info.p) {
        const pid = add('panchayat', p, bid, { expected_villages: v }); panchId[block + '/' + p] = pid;
        panchayats.push({ id: pid, name: p, w: block === 'Imamganj' ? 4 : ['Sherghati', 'Dumaria', 'Gurua', 'Banke Bazar', 'Amas'].includes(block) ? 2 : 1 });
      }
    }

    // Imamganj town area and the 227-Imamganj polling booths (js/booth-data.js)
    if (blockId.Imamganj) {
      const np = add('panchayat', 'Imamganj Nagar Panchayat', blockId.Imamganj); panchId['Imamganj/Imamganj Nagar Panchayat'] = np;
      panchayats.push({ id: np, name: 'Imamganj', w: 4, town: true });
    }
    const booths = [];
    const BD = window.BOOTH_DATA;
    if (BD) for (const [number, name, block, panch] of BD.booths) {
      const pid = panchId[block + '/' + panch];
      if (pid) booths.push({ id: booths.length + 1, assembly: BD.assembly, number, name, panchayat_id: pid, path: locs.get(pid).path });
    }
    const boothsOf = pid => booths.filter(b => b.panchayat_id === pid);

    // deterministic sample members (names and numbers are made up)
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pick = a => a[Math.floor(rnd() * a.length)];
    const male = ['Ramesh', 'Suresh', 'Rajesh', 'Mukesh', 'Dinesh', 'Anil', 'Sunil', 'Vijay', 'Ajay', 'Santosh', 'Manoj', 'Pankaj', 'Ravi', 'Amit', 'Rakesh', 'Umesh', 'Naresh', 'Shankar', 'Arvind', 'Pramod'];
    const female = ['Sunita', 'Anita', 'Rekha', 'Kiran', 'Pooja', 'Priya', 'Savita', 'Geeta', 'Meena', 'Rinku'];
    const elders = ['Ramdeo', 'Shivnandan', 'Jagdish', 'Ramashray', 'Kameshwar', 'Baleshwar', 'Rajendra', 'Mahendra', 'Lalan', 'Shiv Shankar'];
    const occ = ['Farmer / किसान', 'Business / व्यापार', 'Govt job / सरकारी नौकरी', 'Private job / निजी नौकरी', 'Student / छात्र', 'Labour / मजदूर', 'Homemaker / गृहिणी', 'Teacher / शिक्षक'];
    const edu = ['Primary', 'Matric (10th)', 'Inter (12th)', 'Graduate', 'Post-graduate', 'Illiterate / निरक्षर'];
    const weighted = panchayats.flatMap(p => Array(p.w).fill(p));
    const members = [];
    for (let i = 0; i < 420; i++) {
      const g = rnd() < 0.68 ? 'M' : 'F';
      const p = pick(weighted);
      const r = rnd();
      const vr = rnd();
      const phone = '90000' + String(10000 + i * 37).slice(-5);
      members.push({
        id: 'demo-' + i,
        full_name: `${pick(g === 'M' ? male : female)} ${rnd() < 0.5 ? (g === 'F' ? 'Kumari ' : 'Kumar ') : ''}Dangi`,
        guardian_name: `${pick(elders)} Dangi`,
        gender: g, age: 18 + Math.floor(rnd() * 55),
        phone, whatsapp: phone,
        education: pick(edu), occupation: pick(occ), family_size: 2 + Math.floor(rnd() * 8),
        address: 'Ward ' + (1 + Math.floor(rnd() * 12)), notes: '',
        ...(() => { const bs = boothsOf(p.id); const b = bs.length && rnd() < 0.8 ? pick(bs) : null; return { booth_id: b ? b.id : null, booth_no: b ? b.number : null }; })(),
        place_id: p.id, village_name: p.town ? 'Ward ' + (1 + Math.floor(vr * 15)) : vr < 0.55 ? p.name : vr < 0.8 ? `${p.name} Khurd` : `${p.name} Kalan`,
        location_path: locs.get(p.id).path, consent: true,
        status: r < 0.7 ? 'verified' : r < 0.95 ? 'pending' : 'rejected',
        source: rnd() < 0.6 ? 'self' : 'coordinator',
        created_at: new Date(Date.now() - rnd() * 60 * 864e5).toISOString()
      });
    }
    members.sort((a, b) => b.created_at.localeCompare(a.created_at));

    const coords = [
      { email: 'admin@demo.in', full_name: 'Sidharth (you)', phone: '9000000001', role: 'super_admin', location_id: null, active: true },
      { email: 'gaya@demo.in', full_name: 'Sample District Coordinator', phone: '9000000002', role: 'district', location_id: D.Gaya, active: true },
      { email: 'imamganj@demo.in', full_name: 'Sample Block Coordinator', phone: '9000000003', role: 'block', location_id: blockId.Imamganj, active: true },
      { email: 'bikopur@demo.in', full_name: 'Sample Panchayat Coordinator', phone: '9000000004', role: 'panchayat', location_id: panchId['Imamganj/Bikopur'], active: true }
    ];

    let current = null;
    const meRow = () => coords.find(c => c.email === current && c.active);
    const can = path => { const c = meRow(); return !!c && (c.role === 'super_admin' || path.includes(c.location_id)); };
    const isAdmin = () => meRow()?.role === 'super_admin';
    const deny = () => { throw friendlyError({ code: '42501' }); };
    const later = v => new Promise(r => setTimeout(() => r(v), 100));
    const validate = m => {
      m.phone = cleanPhone(m.phone); m.whatsapp = cleanPhone(m.whatsapp) || m.phone;

      if (pl.level === 'village') m.village_name = pl.name;
      m.village_name = tidyVillage(m.village_name);
      if (m.village_name.length < 2) throw new Error('Enter the village name');
      m.location_path = pl.path;

        const b = booths.find(x => x.id === +m.booth_id);

        m.booth_id = b.id; m.booth_no = b.number;
      } else { m.booth_id = null; m.booth_no = null; }
      if (members.some(x => x.id !== m.id && x.phone === m.phone && x.full_name.trim().toLowerCase() === m.full_name.trim().toLowerCase()))
        throw friendlyError({ code: '23505' });
    };
    const notRejected = () => members.filter(m => m.status !== 'rejected');

    return {
      mode: 'demo',
      demoAccounts: coords.map(c => ({ email: c.email, role: c.role, area: c.location_id ? locs.get(c.location_id).name : null })),
      async session() { return current ? { user: { email: current } } : null; },
      onAuth() {},
      async sendCode(email) { if (!coords.some(c => c.email === email)) throw new Error('In the demo, use one of the sample logins below.'); return later(); },
      async verifyCode(email) { current = email; return later(); },
      async signOut() { current = null; },
      async me() {
        const c = meRow(); if (!c) return null;
        const l = c.location_id ? locs.get(c.location_id) : null;
        return later({ ...c, location_name: l?.name || null, location_level: l?.level || null });
      },

      async children(parentId) {
        return later([...locs.values()].filter(l => l.parent_id === (parentId ?? null)).sort((a, b) => a.name.localeCompare(b.name)));
      },
      async locations(ids) { return ids.map(i => locs.get(i)).filter(Boolean); },
      async addLocation(loc) {
        const parent = loc.parent_id ? locs.get(+loc.parent_id) : null;
        const path = parent ? [...parent.path, nextId] : [nextId];
        if (!(isAdmin() || (loc.level === 'village' && can(path)))) deny();
        const exp = { district: 'state', block: 'district', panchayat: 'block', village: 'panchayat' }[loc.level];
        if ((parent?.level || null) !== (exp || null)) throw new Error(`A ${loc.level} must be inside a ${exp}`);
        if ([...locs.values()].some(l => l.parent_id === (parent?.id ?? null) && l.name.toLowerCase() === loc.name.trim().toLowerCase()))
          throw new Error(`${loc.name} is already listed here`);
        const id = add(loc.level, loc.name.trim(), parent?.id, { name_hi: loc.name_hi || null });
        return later(locs.get(id));
      },
      async villageNames(pid) {
        const listed = [...locs.values()].filter(l => l.parent_id === pid && l.level === 'village').map(l => l.name);
        const typed = notRejected().filter(m => m.location_path.includes(pid)).map(m => m.village_name);
        const seen = new Set(listed.map(n => n.toLowerCase()));
        const out = listed.map(n => ({ village_name: n, listed: true }));
        for (const n of typed) if (!seen.has(n.toLowerCase())) { seen.add(n.toLowerCase()); out.push({ village_name: n, listed: false }); }
        return later(out.sort((a, b) => a.village_name.localeCompare(b.village_name)));
      },

      async booths(pid) { return later(boothsOf(pid).map(({ path, ...b }) => b)); },
      async boothsByIds(ids) { return ids.map(i => booths.find(b => b.id === i)).filter(Boolean); },
      async boothBreakdown(locId) {
        const vis = notRejected().filter(m => can(m.location_path) && m.booth_id);
        const pname = id => locs.get(id).name;
        return later(booths.filter(b => b.path.includes(locId)).map(b => {
          const ms = vis.filter(m => m.booth_id === b.id);
          return { booth_id: b.id, number: b.number, name: b.name, assembly: b.assembly, panchayat: pname(b.panchayat_id),
            total: ms.length, verified: ms.filter(m => m.status === 'verified').length, pending: ms.filter(m => m.status === 'pending').length };
        }));
      },

      async registerPublic(m) {
        m = { ...m, id: 'demo-' + Math.random().toString(36).slice(2), status: 'pending', source: 'self', created_at: new Date().toISOString() };
        validate(m); members.unshift(m); return later();
      },
      async addMember(m) {
        m = { ...m, id: 'demo-' + Math.random().toString(36).slice(2), status: m.status || 'verified', source: 'coordinator', created_at: new Date().toISOString() };
        validate(m); if (!can(m.location_path)) deny(); members.unshift(m); return later();
      },
      async updateMember(id, patch) {
        const m = members.find(x => x.id === id); if (!m || !can(m.location_path)) deny();
        const next = { ...m, ...patch }; validate(next); if (!can(next.location_path)) deny();
        Object.assign(m, next); return later();
      },
      async deleteMember(id) {
        if (!isAdmin()) deny();
        const i = members.findIndex(x => x.id === id); if (i >= 0) members.splice(i, 1); return later();
      },
      async getMember(id) { return { ...members.find(x => x.id === id) }; },
      async listMembers(f, { offset = 0, limit = 50 } = {}) {
        const all = members.filter(m => can(m.location_path) && matches(m, f));
        return later({ rows: all.slice(offset, offset + limit).map(m => ({ ...m })), count: all.length });
      },
      async counts(parentId) {
        const kids = [...locs.values()].filter(l => l.parent_id === (parentId ?? null));
        const vis = notRejected().filter(m => can(m.location_path));
        const allPanch = [...locs.values()].filter(l => l.level === 'panchayat');
        return later(kids.map(l => {
          const ms = vis.filter(m => m.location_path.includes(l.id));
          const exp = allPanch.filter(p => p.path.includes(l.id)).reduce((a, p) => a + (p.expected_villages || 0), 0);
          return { location_id: l.id, name: l.name, level: l.level, subdivision: l.subdivision, total: ms.length,
            verified: ms.filter(m => m.status === 'verified').length, pending: ms.filter(m => m.status === 'pending').length,
            villages_reached: new Set(ms.map(m => m.location_path[3] + ':' + m.village_name.toLowerCase())).size,
            expected_villages: exp || null };
        }).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name)));
      },
      async villageBreakdown(pid) {
        const groups = new Map();
        for (const m of notRejected().filter(x => can(x.location_path) && x.location_path.includes(pid))) {
          const k = m.village_name.toLowerCase();
          const g = groups.get(k) || { village_name: m.village_name, total: 0, verified: 0, pending: 0 };
          g.total++; if (m.status === 'verified') g.verified++; if (m.status === 'pending') g.pending++;
          groups.set(k, g);
        }
        return later([...groups.values()].sort((a, b) => b.total - a.total || a.village_name.localeCompare(b.village_name)));
      },

      async coordinators() { return later(isAdmin() ? coords.map(c => ({ ...c })) : coords.filter(c => c.email === current)); },
      async saveCoordinator(c) {
        if (!isAdmin()) deny();
        c = { ...c, email: c.email.trim().toLowerCase() };
        if (c.role !== 'super_admin') {
          const l = locs.get(+c.location_id);
          if (!l || l.level !== c.role) throw new Error(`A ${c.role} coordinator must be assigned a ${c.role}`);
        } else c.location_id = null;
        const i = coords.findIndex(x => x.email === c.email);
        if (i >= 0) coords[i] = { ...coords[i], ...c }; else coords.push({ active: true, ...c });
        return later();
      },
      async removeCoordinator(email) {
        if (!isAdmin()) deny();
        const i = coords.findIndex(x => x.email === email); if (i >= 0) coords.splice(i, 1); return later();
      }
    };
  }

  window.createDataLayer = cfg => (cfg.SUPABASE_URL ? createLive(cfg) : createDemo());
})();

</script>
<script>
/* =====================================================================
   Dangi Samaj Portal — app screens
   ===================================================================== */
(function () {
  const C = window.APP_CONFIG;
  const LEVELS = window.LEVELS;
  const app = document.getElementById('app');
  let data, me = null;

  /* ---------------------------------------------------------- helpers */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = n => Number(n || 0).toLocaleString('en-IN');
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } }
  };

  const LVL = { state: 'राज्य · State', district: 'जिला · District', block: 'प्रखंड · Block', panchayat: 'पंचायत · Panchayat', village: 'गाँव · Village' };
  const LVL_PL = { state: 'States', district: 'Districts', block: 'Blocks', panchayat: 'Panchayats', village: 'Villages' };
  const ROLE = { super_admin: 'Super admin', state: 'State coordinator', district: 'District coordinator', block: 'Block coordinator', panchayat: 'Panchayat coordinator' };
  const STATUS = { verified: 'Verified', pending: 'Pending', rejected: 'Rejected' };
  const GENDER = { M: 'Male · पुरुष', F: 'Female · महिला', O: 'Other · अन्य' };
  const EDU = ['Illiterate / निरक्षर', 'Primary', 'Middle (8th)', 'Matric (10th)', 'Inter (12th)', 'Diploma / ITI', 'Graduate', 'Post-graduate', 'Professional (Engg / Medical / Law)'];
  const OCC = ['Farmer / किसान', 'Business / व्यापार', 'Govt job / सरकारी नौकरी', 'Private job / निजी नौकरी', 'Teacher / शिक्षक', 'Student / छात्र', 'Labour / मजदूर', 'Homemaker / गृहिणी', 'Retired / सेवानिवृत्त'];

  function toast(msg, kind = 'ok') {
    const t = document.createElement('div');
    t.className = 'toast ' + kind; t.textContent = msg; t.setAttribute('role', 'status');
    document.body.appendChild(t);
    setTimeout(() => t.classList.add('out'), 3200);
    setTimeout(() => t.remove(), 3700);
  }

  function confirmBox(text, okLabel = 'Confirm', danger = false) {
    return new Promise(res => {
      const d = document.createElement('div');
      d.className = 'modal-back';
      d.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><p>${esc(text)}</p>
        <div class="row end"><button class="btn ghost" data-v="0">Cancel</button>
        <button class="btn ${danger ? 'danger' : 'primary'}" data-v="1">${esc(okLabel)}</button></div></div>`;
      d.addEventListener('click', e => {
        const v = e.target.dataset.v;
        if (v != null || e.target === d) { d.remove(); res(v === '1'); }
      });
      document.body.appendChild(d);
      $('[data-v="1"]', d).focus();
    });
  }

  async function copyText(text, label) {
    try { await navigator.clipboard.writeText(text); toast(`${label} copied`); }
    catch {
      const d = document.createElement('div');
      d.className = 'modal-back';
      d.innerHTML = `<div class="modal"><p>Select all and copy:</p><textarea id="copy-fallback" rows="8">${esc(text)}</textarea>
        <div class="row end"><button class="btn primary">Done</button></div></div>`;
      d.querySelector('button').onclick = () => d.remove();
      document.body.appendChild(d);
      const ta = $('#copy-fallback', d); ta.focus(); ta.select();
    }
  }

  function download(filename, text, mime) {
    if (data.mode === 'demo' && window.self !== window.top) {
      toast('Downloads are turned off in this preview. They work in the real app.', 'warn');
      return;
    }
    const blob = new Blob([text], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  const busy = (btn, on, label) => {
    if (!btn) return;
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || 'Please wait…'; btn.disabled = true; }
    else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; }
  };

  /* location name helpers */
  async function pathText(path, from = 'district') {
    const locs = await data.locations(path);
    const start = LEVELS.indexOf(from);
    return locs.filter(l => LEVELS.indexOf(l.level) >= start).reverse().map(l => l.name).join(' · ');
  }
  async function primeNames(rows) { await data.locations(rows.flatMap(r => r.location_path || [])); }

  /* ---------------------------------------------------------- location picker
     Cascading selects: State → District → Block → Panchayat → Village.
     locked: ids of a coordinator's own area (those levels are fixed). */
  async function locPicker(box, { upto = 'panchayat', locked = [], allowAll = false, required = false, value = null, onChange = () => {} } = {}) {
    const lv = LEVELS.slice(0, LEVELS.indexOf(upto) + 1);
    const vals = Array(lv.length).fill(null);
    let preset = [];
    if (value) { const [v] = await data.locations([value]); if (v) preset = v.path; }
    box.classList.add('loc-grid');
    box.innerHTML = lv.map((l, i) => `<label class="field"><span>${LVL[l]}${required ? ' *' : ''}</span>
      <select data-i="${i}" ${required ? 'required' : ''}></select></label>`).join('');
    const sels = $$('select', box);

    const deepest = () => { for (let i = vals.length - 1; i >= 0; i--) if (vals[i]) return { id: vals[i], level: lv[i], index: i }; return null; };

    async function fill(i) {
      for (let j = i; j < sels.length; j++) {
        vals[j] = null; sels[j].innerHTML = `<option value="">${allowAll ? 'All · सभी' : '— चुनें · Select —'}</option>`; sels[j].disabled = true;
      }
      if (i >= sels.length) return;
      const parent = i === 0 ? null : vals[i - 1];
      if (i > 0 && !parent) return;
      const items = await data.children(parent);
      const sel = sels[i];
      const optHTML = it => `<option value="${it.id}">${esc(it.name)}${it.name_hi ? ' · ' + esc(it.name_hi) : ''}</option>`;
      if (items.some(it => it.subdivision)) {
        // blocks: group them under their subdivision (अनुमंडल)
        const groups = {};
        items.forEach(it => (groups[it.subdivision || 'Other'] ||= []).push(it));
        sel.insertAdjacentHTML('beforeend', Object.keys(groups).sort().map(g =>
          `<optgroup label="${esc(g)} अनुमंडल · subdivision">${groups[g].map(optHTML).join('')}</optgroup>`).join(''));
      } else sel.insertAdjacentHTML('beforeend', items.map(optHTML).join(''));
      if (!items.length) { sel.innerHTML = `<option value="">No ${LVL_PL[lv[i]].toLowerCase()} added yet</option>`; return; }
      sel.disabled = false;
      let pick = locked[i] ?? preset[i] ?? null;
      if (pick == null && !allowAll && i <= 1) {
        const want = i === 0 ? C.DEFAULT_STATE : C.DEFAULT_DISTRICT;
        const def = items.find(it => it.name === want) || (i === 0 && items.length === 1 ? items[0] : null);
        if (def) pick = def.id;
      }
      if (pick != null && items.some(it => it.id === pick)) {
        sel.value = String(pick); vals[i] = pick;
        if (locked[i] != null) sel.disabled = true;
        await fill(i + 1);
      }
    }

    sels.forEach((sel, i) => sel.addEventListener('change', async () => {
      vals[i] = sel.value ? +sel.value : null;
      preset = [];
      await fill(i + 1);
      onChange(deepest());
    }));
    await fill(0);
    onChange(deepest());
    return { get: deepest, panchayatId: () => vals[LEVELS.indexOf('panchayat')] || null };
  }

  const scopeLocked = () => (me && me.path ? me.path : []);

  /* ---------------------------------------------------------- offline queue (public form) */
  const QKEY = 'dangi-queue';
  async function flushQueue() {
    const q = store.get(QKEY, []);
    if (!q.length || !navigator.onLine) return;
    const left = [];
    for (const m of q) {
      try { await data.registerPublic(m); } catch (e) { if (e.offline) left.push(m); }
    }
    store.set(QKEY, left);
    if (q.length - left.length > 0) toast(`${q.length - left.length} saved registration(s) sent`);
  }

  /* ---------------------------------------------------------- shell */
  const TABS = [
    { id: 'overview', label: 'Overview' },
    { id: 'members', label: 'Members' },
    { id: 'add', label: 'Add member' },
    { id: 'message', label: 'Send message' },
    { id: 'locations', label: 'Locations' },
    { id: 'coordinators', label: 'Coordinators', admin: true }
  ];
  let current = 'register';

  function shell(view) {
    const demo = data.mode === 'demo';
    const area = me ? (me.role === 'super_admin' ? 'All India' : me.location_name) : '';
    app.innerHTML = `
      ${demo ? `<div class="demo-bar"><div class="wrap">Demo mode with sample data. Nothing here is real. Connect Supabase in <code>config.js</code> to go live.</div></div>` : ''}
      <header class="top"><div class="wrap top-in">
        <button class="brand" data-go="${me ? 'overview' : 'register'}" aria-label="Home">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-text"><b>${esc(C.APP_NAME)}</b><small>${esc(C.APP_NAME_EN)}</small></span>
        </button>
        <div class="top-right">${me
          ? `<span class="who"><b>${esc(ROLE[me.role])}</b><small>${esc(area)}</small></span><button class="btn small on-dark" id="signout">Sign out</button>`
          : (view === 'login' ? `<button class="btn small on-dark" data-go="register">Registration form</button>` : `<button class="btn small on-dark" data-go="login">Coordinator login</button>`)}
        </div></div>
        ${me ? `<nav class="tabs" aria-label="Sections"><div class="wrap tabs-in">${TABS.filter(t => !t.admin || me.role === 'super_admin')
          .map(t => `<button class="tab ${t.id === view ? 'on' : ''}" data-go="${t.id}">${t.label}</button>`).join('')}</div></nav>` : ''}
      </header>
      <main class="wrap main" id="view"></main>
      <footer class="wrap foot">${esc(C.APP_NAME_EN)} · data is visible only to authorised coordinators of each area</footer>`;
    $$('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
    const so = $('#signout');
    if (so) so.onclick = async () => { await data.signOut(); me = null; resetViews(); go('register'); };
    return $('#view');
  }

  async function go(view, opts = {}) {
    const priv = TABS.some(t => t.id === view);
    if (priv && !me) view = 'login';
    if (view === 'coordinators' && me?.role !== 'super_admin') view = 'overview';
    if (view === 'register' && me && !opts.force) view = 'overview';
    current = view;
    try { if (location.hash.slice(1) !== view) history.replaceState(null, '', '#' + view); } catch { /* sandboxed */ }
    const root = shell(view);
    root.innerHTML = '<div class="loading">Loading…</div>';
    try {
      await ({ register: viewRegister, login: viewLogin, overview: viewOverview, members: viewMembers, add: viewAdd,
        message: viewMessage, locations: viewLocations, coordinators: viewCoordinators }[view] || viewRegister)(root, opts);
    } catch (e) {
      root.innerHTML = `<div class="card error-card"><h2>Something went wrong</h2><p>${esc(e.message)}</p>
        <button class="btn primary" id="retry">Try again</button></div>`;
      $('#retry').onclick = () => go(view, opts);
    }
    window.scrollTo(0, 0);
  }

  /* ---------------------------------------------------------- member form (shared) */
  function memberFormHTML(m = {}, { coordinator = false } = {}) {
    const opt = (list, v) => list.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
    return `
      <fieldset class="group"><legend>स्थान · Location</legend><div id="loc"></div>
        <label class="field"><span>गाँव का नाम · Village name *</span>
          <input id="f-village" list="village-list" required autocomplete="off" value="${esc(m.village_name)}" placeholder="पंचायत चुनें, फिर गाँव लिखें · choose panchayat, then type village">
          <datalist id="village-list"></datalist></label>
        <p class="hint" id="village-hint" hidden></p>
        <label class="field" id="booth-wrap" hidden><span>मतदान बूथ · Polling booth <small class="muted">(पता हो तो · if known)</small></span>
          <select id="f-booth"></select></label>
      </fieldset>
      <fieldset class="group"><legend>व्यक्तिगत जानकारी · Personal details</legend>
        <div class="grid2">
          <label class="field span2"><span>पूरा नाम · Full name *</span><input id="f-name" required minlength="2" autocomplete="name" value="${esc(m.full_name)}" placeholder="जैसे: Ramesh Kumar Dangi"></label>
          <label class="field span2"><span>पिता / पति का नाम · Father's / husband's name</span><input id="f-guardian" value="${esc(m.guardian_name)}"></label>
          <label class="field"><span>लिंग · Gender *</span><select id="f-gender" required><option value="">— Select —</option>
            ${Object.entries(GENDER).map(([k, v]) => `<option value="${k}" ${m.gender === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          <label class="field"><span>उम्र · Age</span><input id="f-age" type="number" inputmode="numeric" min="0" max="120" value="${esc(m.age)}"></label>
        </div>
      </fieldset>
      <fieldset class="group"><legend>संपर्क · Contact</legend>
        <div class="grid2">
          <label class="field"><span>मोबाइल नंबर · Mobile *</span><input id="f-phone" type="tel" inputmode="numeric" required placeholder="10 अंक · 10 digits" value="${esc(m.phone)}"></label>
          <label class="field"><span>व्हाट्सऐप नंबर · WhatsApp</span><input id="f-wa" type="tel" inputmode="numeric" placeholder="अगर अलग हो · if different" value="${m.whatsapp && m.whatsapp !== m.phone ? esc(m.whatsapp) : ''}"></label>
          <label class="field span2"><span>पता / टोला / वार्ड · Address, tola or ward</span><input id="f-address" value="${esc(m.address)}"></label>
        </div>
      </fieldset>
      <fieldset class="group"><legend>परिवार और काम · Family and work</legend>
        <div class="grid2">
          <label class="field"><span>शिक्षा · Education</span><select id="f-edu"><option value="">— Select —</option>${opt(EDU, m.education)}</select></label>
          <label class="field"><span>व्यवसाय · Occupation</span><input id="f-occ" list="occ-list" value="${esc(m.occupation)}"><datalist id="occ-list">${OCC.map(o => `<option value="${esc(o)}">`).join('')}</datalist></label>
          <label class="field"><span>परिवार के सदस्य · Family members</span><input id="f-family" type="number" inputmode="numeric" min="1" max="100" value="${esc(m.family_size)}"></label>
          ${coordinator ? `<label class="field"><span>स्थिति · Status</span><select id="f-status">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${(m.status || 'verified') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>` : ''}
          ${coordinator ? `<label class="field span2"><span>टिप्पणी · Notes (only coordinators see this)</span><input id="f-notes" value="${esc(m.notes)}"></label>` : ''}
        </div>
      </fieldset>
      <label class="consent"><input type="checkbox" id="f-consent" required ${m.consent ? 'checked' : ''}>
        <span>मैं सहमत हूँ कि मेरी जानकारी दांगी समाज के रिकॉर्ड में रखी जाए और समाज की सूचनाएँ मुझे SMS / WhatsApp पर भेजी जाएँ।
        <small>I agree that my details are kept in the Dangi Samaj records and that I may receive community messages on SMS or WhatsApp. I can ask a coordinator to remove my details at any time.</small></span></label>`;
  }

  /* the village part of a polling-station name: "Madhya Vidyalay, Hurmeth (Bayan Bhaag)" -> "Hurmeth" */
  function boothPlace(name) {
    if (!name || !name.includes(',')) return null;
    const v = name.split(',').pop().replace(/\(.*$/, '').replace(/\b(Awasthist|Isthit|Sthit)\b.*$/i, '').trim();
    return v.length >= 2 ? v : null;
  }
  const boothLabel = b => `${b.number} · ${b.name}`;

  /* location picker + typed village with suggestions + polling booth of the chosen panchayat */
  async function mountPlace(root, { locked = [], placeId = null, boothId = null } = {}) {
    let listed = [];            // official villages of this panchayat, if any were added
    let booths = [];
    let currentP;
    const input = $('#f-village', root), dl = $('#village-list', root), hint = $('#village-hint', root);
    const bwrap = $('#booth-wrap', root), bsel = $('#f-booth', root);
    async function onPanchayat(pid) {
      if (pid === currentP) return;
      currentP = pid; dl.innerHTML = ''; hint.hidden = true; listed = []; booths = []; bwrap.hidden = true; bsel.innerHTML = '';
      input.disabled = !pid;
      if (!pid) return;
      const [names, kids, [p], bs] = await Promise.all([data.villageNames(pid), data.children(pid), data.locations([pid]), data.booths(pid)]);
      if (pid !== currentP) return;
      listed = kids.filter(k => k.level === 'village');
      booths = bs;
      const sugg = new Map();
      names.forEach(n => sugg.set(n.village_name.toLowerCase(), n.village_name));
      bs.map(b => boothPlace(b.name)).filter(Boolean).forEach(v => { if (!sugg.has(v.toLowerCase())) sugg.set(v.toLowerCase(), v); });
      dl.innerHTML = [...sugg.values()].sort().map(v => `<option value="${esc(v)}">`).join('');
      const exp = p?.expected_villages;
      hint.innerHTML = `${esc(p.name)}${/nagar/i.test(p.name) ? '' : ' पंचायत'}${exp ? ` में ${exp} गाँव हैं · has ${exp} villages on record` : ''}${bs.length ? ` · ${bs.length} polling booths` : ''}.
        ${names.length ? `Already registered from: <b>${names.slice(0, 8).map(n => esc(n.village_name)).join(', ')}${names.length > 8 ? '…' : ''}</b>. Pick one if it is yours, or type your ${/nagar/i.test(p.name) ? 'ward or mohalla' : 'village'}.` : `Type your ${/nagar/i.test(p.name) ? 'ward or mohalla' : 'village name'}.`}`;
      hint.hidden = false;
      if (bs.length) {
        bsel.innerHTML = `<option value="">पता नहीं · Don't know</option>` + bs.map(b => `<option value="${b.id}">${esc(boothLabel(b))}</option>`).join('');
        if (boothId && bs.some(b => b.id === boothId)) bsel.value = String(boothId);
        bwrap.hidden = false;
      }
    }
    bsel.addEventListener('change', () => {
      const b = booths.find(x => x.id === +bsel.value);
      if (b && !input.value.trim()) { const v = boothPlace(b.name); if (v) input.value = v; }
    });
    const picker = await locPicker($('#loc', root), {
      required: true, locked, value: placeId,
      onChange: d => onPanchayat(d && d.level === 'panchayat' ? d.id : null)
    });
    await onPanchayat(picker.panchayatId());
    return {
      get() {
        const pid = picker.panchayatId();
        if (!pid) throw new Error('कृपया प्रखंड और पंचायत चुनें · Please choose the block and panchayat.');
        const name = tidyVillage(input.value);
        if (name.length < 2) throw new Error('कृपया गाँव का नाम लिखें · Please type the village name.');
        const official = listed.find(v => v.name.toLowerCase() === name.toLowerCase());
        return { place_id: official ? official.id : pid, village_name: official ? official.name : name,
          booth_id: bsel.value && !bwrap.hidden ? +bsel.value : null };
      }
    };
  }

  function readMember(root, place) {
    const v = id => $(id, root)?.value.trim() ?? '';
    const n = id => (v(id) ? +v(id) : null);
    const m = {
      full_name: v('#f-name'), guardian_name: v('#f-guardian') || null, gender: v('#f-gender') || null,
      age: n('#f-age'), phone: cleanPhone(v('#f-phone')), whatsapp: cleanPhone(v('#f-wa')) || null,
      address: v('#f-address') || null, education: v('#f-edu') || null, occupation: v('#f-occ') || null,
      family_size: n('#f-family'), consent: $('#f-consent', root).checked,
      ...place.get()
    };
    if ($('#f-status', root)) m.status = v('#f-status');
    if ($('#f-notes', root)) m.notes = v('#f-notes') || null;
    if (!/^[6-9]\d{9}$/.test(m.phone)) throw new Error('मोबाइल नंबर 10 अंकों का होना चाहिए · Enter a valid 10-digit mobile number.');
    if (m.whatsapp && !/^[6-9]\d{9}$/.test(m.whatsapp)) throw new Error('WhatsApp number must be 10 digits.');
    if (!m.consent) throw new Error('सहमति ज़रूरी है · Please tick the consent box.');
    return m;
  }

  /* ---------------------------------------------------------- PUBLIC: registration */
  async function viewRegister(root) {
    const queued = store.get(QKEY, []).length;
    root.innerHTML = `
      <section class="intro">
        <p class="eyebrow">सदस्य पंजीकरण · Member registration</p>
        <h1>दांगी समाज परिवार से जुड़ें</h1>
        <p class="lede">Fill this form once for each adult member. Your details reach only the coordinators of your own district, block and panchayat.</p>
      </section>
      ${queued ? `<div class="note warn">${queued} form(s) are saved on this phone and will be sent when the internet is back.</div>` : ''}
      <form class="card form" id="reg" novalidate>${memberFormHTML()}
        <div class="row end"><button class="btn primary big" type="submit">पंजीकरण करें · Register</button></div>
      </form>`;
    const picker = await mountPlace(root);
    $('#reg', root).addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.submitter || $('button[type=submit]', root);
      let m;
      try { m = readMember(root, picker); } catch (err) { toast(err.message, 'bad'); return; }
      busy(btn, true, 'Saving…');
      try {
        await data.registerPublic(m);
        done(m, false);
      } catch (err) {
        if (err.offline || !navigator.onLine) { store.set(QKEY, [...store.get(QKEY, []), m]); done(m, true); }

    function done(m, offline) {
      root.innerHTML = `<div class="card success">
        <div class="tick" aria-hidden="true"></div>
        <h2>${offline ? 'फ़ॉर्म इस फ़ोन में सेव हो गया' : 'धन्यवाद! पंजीकरण हो गया'}</h2>
        <p>${offline ? 'There is no internet right now. The form is saved on this phone and will be sent automatically when you are back online. Keep this page open or open it again later.'
          : `${esc(m.full_name)} has been registered. A coordinator from your area will verify the details.`}</p>
        <div class="row center"><button class="btn primary" id="again">एक और सदस्य जोड़ें · Register another</button></div></div>`;
      $('#again').onclick = () => go('register', { force: true });
    }
  }

    const demo = data.mode === 'demo';
    root.innerHTML = `<div class="card narrow">
      <p class="eyebrow">Coordinators only</p><h1 class="h2">Coordinator login</h1>
      <p class="muted">Enter the email address the super admin registered for you. We'll email you a login link.</p>

        <label class="field"><span>Or type the code, if your email shows one</span>

        <button class="btn primary" type="submit">Log in</button>
        <button class="btn ghost" type="button" id="l-back">Use a different email</button></form>
      ${demo ? `<div class="demo-logins"><p class="muted">Demo: log in as</p>${data.demoAccounts.map(a =>
        `<button class="btn" data-demo="${a.email}">${ROLE[a.role]}${a.area ? ' · ' + esc(a.area) : ''}</button>`).join('')}</div>` : ''}
    </div>`;
    let email = '';
    const finish = async () => {
      me = await data.me();
      if (!me) {
        toast('This email is not registered as a coordinator. Ask the super admin to add you.', 'bad');
        await data.signOut(); return;
      }
      resetViews(); await loadScope(); go('overview');
    };
    $('#step1').onsubmit = async e => {
      e.preventDefault(); email = $('#l-email').value.trim().toLowerCase();
      const b = e.submitter; busy(b, true, 'Sending…');
      try { await data.sendCode(email); $('#step1').hidden = true; $('#step2').hidden = false; $('#l-code').focus(); toast('Login link sent. Check your email.'); }
      catch (err) { toast(err.message, 'bad'); } finally { busy(b, false); }
    };
    $('#step2').onsubmit = async e => {
      e.preventDefault(); const b = e.submitter; busy(b, true, 'Checking…');

      catch (err) { toast(err.message, 'bad'); } finally { busy(b, false); }

    $$('[data-demo]').forEach(b => b.onclick = async () => { await data.verifyCode(b.dataset.demo); await finish(); });
  }

  function resetViews() { ['ov-node', 'ov-by', 'mem-filter', 'msg-filter'].forEach(k => store.set(k, null)); }

  async function loadScope() {
    if (me && me.location_id) { const [l] = await data.locations([me.location_id]); me.path = l ? l.path : []; }
    else if (me) me.path = [];
  }

  /* ---------------------------------------------------------- OVERVIEW (drill-down) */
  async function viewOverview(root, { node, by } = {}) {
    const scopeId = me.location_id ?? null;
    node = node ?? store.get('ov-node', null) ?? scopeId;
    // never go above the coordinator's own area
    let nodeLoc = node ? (await data.locations([node]))[0] : null;
    if (scopeId && (!nodeLoc || !nodeLoc.path.includes(scopeId))) { node = scopeId; nodeLoc = (await data.locations([node]))[0]; }
    store.set('ov-node', node);

    if (nodeLoc?.level === 'village') { node = nodeLoc.parent_id; nodeLoc = (await data.locations([node]))[0]; store.set('ov-node', node); }
    const atPanchayat = nodeLoc?.level === 'panchayat';
    const rows = atPanchayat ? [] : await data.counts(node);
    const vrows = atPanchayat ? await data.villageBreakdown(node) : [];
    const crumbs = [];
    if (!scopeId) crumbs.push({ id: null, name: 'All India' });
    if (nodeLoc) {
      const anc = await data.locations(nodeLoc.path);
      anc.forEach(a => { if (!scopeId || a.path.includes(scopeId)) crumbs.push({ id: a.id, name: a.name }); });
    }
    const boothRows = nodeLoc && ['district', 'block', 'panchayat'].includes(nodeLoc.level) ? await data.boothBreakdown(node) : [];
    by = boothRows.length ? (by || store.get('ov-by', 'area')) : 'area';
    store.set('ov-by', by);
    const sum = list => list.reduce((a, r) => ({ total: a.total + r.total, verified: a.verified + r.verified, pending: a.pending + r.pending }), { total: 0, verified: 0, pending: 0 });
    let tot;
    if (atPanchayat) tot = sum(vrows);
    else if (rows.length) tot = sum(rows);
    else {
      const f = { locationId: node || undefined, excludeRejected: true };
      const [all, ver, pen] = await Promise.all([data.listMembers(f, { limit: 1 }), data.listMembers({ ...f, status: 'verified' }, { limit: 1 }), data.listMembers({ ...f, status: 'pending' }, { limit: 1 })]);
      tot = { total: all.count, verified: ver.count, pending: pen.count };
    }
    const reached = atPanchayat ? vrows.length : rows.reduce((a, r) => a + (r.villages_reached || 0), 0);
    const expected = atPanchayat ? nodeLoc.expected_villages : rows.reduce((a, r) => a + (r.expected_villages || 0), 0) || null;
    const childLevel = rows[0]?.level;
    const max = Math.max(1, ...(atPanchayat ? vrows : rows).map(r => r.total));
    const bar = r => `<td class="bar-col"><span class="bar"><i style="width:${(r.total / max * 100).toFixed(1)}%"></i><i class="v" style="width:${(r.verified / max * 100).toFixed(1)}%"></i></span></td>`;
    const vr = r => (r.expected_villages ? `${num(r.villages_reached)}<small> / ${num(r.expected_villages)}</small>` : num(r.villages_reached));
    const rowHTML = r => `<tr data-node="${r.location_id}" tabindex="0" class="${r.total ? '' : 'zero'}">
      <td>${esc(r.name)}</td><td class="num">${num(r.total)}</td><td class="num hide-sm">${num(r.verified)}</td><td class="num hide-sm">${num(r.pending)}</td>
      <td class="num">${vr(r)}</td>${bar(r)}</tr>`;

    // blocks: show them under their subdivision with a subtotal line
    let body;
    if (rows.some(r => r.subdivision)) {
      const groups = {};
      rows.forEach(r => (groups[r.subdivision || 'Other'] ||= []).push(r));
      body = Object.entries(groups).sort((a, b) => sum(b[1]).total - sum(a[1]).total || a[0].localeCompare(b[0])).map(([g, list]) => {
        const t = sum(list);
        return `<tr class="grp"><td colspan="6">${esc(g)} अनुमंडल · subdivision <span>${num(t.total)} members · ${list.length} blocks</span></td></tr>${list.map(rowHTML).join('')}`;
      }).join('');
    } else body = rows.map(rowHTML).join('');

    const head = name => `<thead><tr><th>${name}</th><th class="num">Members</th><th class="num hide-sm">Verified</th><th class="num hide-sm">Pending</th>`;
    let table = '';
    if (rows.length) {
      table = `<section class="card flush">
        <div class="table-head"><h2 class="h3">By ${LVL_PL[childLevel].toLowerCase().replace(/s$/, '')}</h2><span class="muted small">Tap a row to open it</span></div>
        <div class="tbl-wrap"><table class="tbl drill">${head(LVL[childLevel])}<th class="num">Villages reached</th><th class="bar-col" aria-hidden="true"></th></tr></thead>
        <tbody>${body}</tbody></table></div></section>`;
    } else if (atPanchayat && vrows.length) {
      table = `<section class="card flush">
        <div class="table-head"><h2 class="h3">By village</h2><span class="muted small">Names as typed by members · tap to see who is registered</span></div>
        <div class="tbl-wrap"><table class="tbl drill">${head(LVL.village)}<th class="bar-col" aria-hidden="true"></th></tr></thead>
        <tbody>${vrows.map(r => `<tr data-village="${esc(r.village_name)}" tabindex="0"><td>${esc(r.village_name)}</td><td class="num">${num(r.total)}</td>
          <td class="num hide-sm">${num(r.verified)}</td><td class="num hide-sm">${num(r.pending)}</td>${bar(r)}</tr>`).join('')}</tbody></table></div></section>
        <p class="muted small">If one village appears under two spellings, open its members and correct the village name with Edit.</p>`;
    } else {
      table = `<div class="card empty"><p>${atPanchayat ? 'No one from this panchayat has registered yet. Share the registration link in its WhatsApp groups.' : 'No areas have been added below this one yet. Add them under Locations.'}</p></div>`;
    }

    if (by === 'booth') {
      const bmax = Math.max(1, ...boothRows.map(r => r.total));
      const showP = nodeLoc.level !== 'panchayat';
      const groups = {};
      boothRows.forEach(r => (groups[r.assembly] ||= []).push(r));
      const multi = Object.keys(groups).length > 1;
      table = `<section class="card flush">
        <div class="table-head"><h2 class="h3">By polling booth</h2><span class="muted small">${boothRows.length} booths · tap to see who is registered</span></div>
        <div class="tbl-wrap"><table class="tbl drill booths">
          <thead><tr><th class="num">No.</th><th>Polling station</th>${showP ? '<th class="hide-sm">Panchayat</th>' : ''}<th class="num">Members</th><th class="num hide-sm">Verified</th><th class="num hide-sm">Pending</th><th class="bar-col" aria-hidden="true"></th></tr></thead>
          <tbody>${Object.entries(groups).map(([a, list]) => `${multi ? `<tr class="grp"><td colspan="${showP ? 7 : 6}">${esc(a)} Vidhan Sabha</td></tr>` : ''}${list.map(r => `
            <tr data-booth="${r.booth_id}" tabindex="0" class="${r.total ? '' : 'zero'}"><td class="num mono">${r.number}</td><td>${esc(r.name)}</td>
            ${showP ? `<td class="hide-sm small">${esc(r.panchayat)}</td>` : ''}<td class="num">${num(r.total)}</td><td class="num hide-sm">${num(r.verified)}</td><td class="num hide-sm">${num(r.pending)}</td>
            <td class="bar-col"><span class="bar"><i style="width:${(r.total / bmax * 100).toFixed(1)}%"></i><i class="v" style="width:${(r.verified / bmax * 100).toFixed(1)}%"></i></span></td></tr>`).join('')}`).join('')}</tbody>
        </table></div></section>
        <p class="muted small">Booth counts include only members who chose their booth on the form. Coordinators can add the booth with Edit.</p>`;
    }
    const assemblies = [...new Set(boothRows.map(r => r.assembly))];
    const toggle = boothRows.length ? `<div class="seg" role="group" aria-label="Show">
        <button class="${by === 'area' ? 'on' : ''}" data-by="area">${atPanchayat ? 'By village' : 'By ' + (LVL_PL[childLevel] || 'area').toLowerCase().replace(/s$/, '')}</button>
        <button class="${by === 'booth' ? 'on' : ''}" data-by="booth">By polling booth</button></div>` : '';
    const boothsWith = boothRows.filter(r => r.total > 0).length;

    root.innerHTML = `
      <nav class="crumbs" aria-label="Area">${crumbs.map((c, i) => i === crumbs.length - 1
        ? `<span aria-current="page">${esc(c.name)}</span>` : `<button data-node="${c.id ?? ''}">${esc(c.name)}</button><i>›</i>`).join('')}</nav>
      <div class="head-row"><div><h1 class="h2">${esc(nodeLoc?.name || 'All India')}</h1>
        ${nodeLoc ? `<p class="muted small sub">${LVL[nodeLoc.level]}${nodeLoc.subdivision ? ` · ${esc(nodeLoc.subdivision)} subdivision` : ''}</p>` : ''}</div>
        <div class="row"><button class="btn" id="ov-members">View members</button><button class="btn primary" id="ov-msg">Message these members</button></div></div>
      ${assemblies.length ? `<p class="muted small sub">Polling booths: ${assemblies.map(a => esc(a) + ' Vidhan Sabha').join(', ')}</p>` : ''}
      <div class="stats">
        <div class="stat"><span>Registered members</span><b>${num(tot.total)}</b></div>
        <div class="stat ok"><span>Verified</span><b>${num(tot.verified)}</b></div>
        <div class="stat warn"><span>Waiting for verification</span><b>${num(tot.pending)}</b>${tot.pending ? '<button class="link" id="ov-pending">Review now →</button>' : ''}</div>
        <div class="stat"><span>Villages reached</span><b>${num(reached)}${expected ? `<small> of ${num(expected)}</small>` : ''}</b>
          ${expected ? `<span class="meter" aria-hidden="true"><i style="width:${Math.min(100, reached / expected * 100).toFixed(1)}%"></i></span>` : ''}</div>
        ${boothRows.length ? `<div class="stat"><span>Booths with members</span><b>${num(boothsWith)}<small> of ${num(boothRows.length)}</small></b>
          <span class="meter" aria-hidden="true"><i style="width:${(boothsWith / boothRows.length * 100).toFixed(1)}%"></i></span></div>` : ''}
      </div>
      ${toggle}
      ${table}`;
    $$('[data-by]', root).forEach(b => b.onclick = () => go('overview', { node, by: b.dataset.by }));
    $$('[data-booth]', root).forEach(el => {
      const openB = () => go('members', { filter: { locationId: node, boothId: +el.dataset.booth } });
      el.addEventListener('click', openB);
      el.addEventListener('keydown', e => { if (e.key === 'Enter') openB(); });
    });
    $$('[data-village]', root).forEach(el => {
      const openV = () => go('members', { filter: { locationId: node, village: el.dataset.village } });
      el.addEventListener('click', openV);
      el.addEventListener('keydown', e => { if (e.key === 'Enter') openV(); });
    });

    const open = id => go('overview', { node: id === '' ? null : +id });
    $$('[data-node]', root).forEach(el => {
      el.addEventListener('click', () => open(el.dataset.node));
      el.addEventListener('keydown', e => { if (e.key === 'Enter') open(el.dataset.node); });
    });
    $('#ov-members').onclick = () => go('members', { filter: { locationId: node } });
    $('#ov-msg').onclick = () => go('message', { filter: { locationId: node } });
    const p = $('#ov-pending'); if (p) p.onclick = () => go('members', { filter: { locationId: node, status: 'pending' } });
  }
